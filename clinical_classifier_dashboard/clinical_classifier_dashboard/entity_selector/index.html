<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#eef2ff;background:transparent}
label{display:block;margin:0 0 10px;color:#cbd3e5}
textarea{box-sizing:border-box;width:100%;height:180px;resize:vertical;padding:18px;border:1px solid #343950;border-radius:16px;background:linear-gradient(120deg,#15172c,#0b2026);color:#f4f7ff;font:16px/1.7 system-ui;outline-color:#8b7cff}
textarea::selection{background:#7763dd;color:white}
footer{display:flex;align-items:center;gap:16px;margin-top:10px}
button{background:#202338;color:#eee;border:1px solid #484662;border-radius:8px;padding:7px 12px;cursor:pointer}
#status{color:#31d7c6;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<label for="text">Highlight the entity below with your mouse, or use Shift + arrow keys. Classification runs automatically.</label>
<textarea id="text" readonly aria-label="Highlight a clinical entity"></textarea>
<footer><button id="clear">Clear selection</button><span id="status" aria-live="polite">Highlight one word or phrase.</span></footer>
<script>
const box=document.getElementById("text"), status=document.getElementById("status");
let revision="", last="", timer;
function send(type, data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},"*");}
function resize(){send("streamlit:setFrameHeight",{height:document.body.scrollHeight+12});}
function publish(){
 let a=box.selectionStart,b=box.selectionEnd;
 if(a===b)return;
 const raw=box.value.slice(a,b), trimmed=raw.trim();
 if(!trimmed)return;
 a+=raw.length-raw.trimStart().length;b=a+trimmed.length;
 const value={revision,start:Array.from(box.value.slice(0,a)).length,end:Array.from(box.value.slice(0,b)).length,text:trimmed};
 const token=JSON.stringify(value);if(token===last)return;last=token;
 status.textContent="Selected: "+trimmed;
 send("streamlit:setComponentValue",{value,dataType:"json"});resize();
}
function schedule(){clearTimeout(timer);timer=setTimeout(publish,300);}
box.addEventListener("pointerup",schedule);
box.addEventListener("keyup",schedule);
box.addEventListener("select",schedule);
document.getElementById("clear").onclick=()=>{
 clearTimeout(timer);box.setSelectionRange(0,0);last="";
 status.textContent="Highlight one word or phrase.";
 send("streamlit:setComponentValue",{value:{revision,clear:true},dataType:"json"});resize();
};
window.addEventListener("message",e=>{
 if(e.source!==window.parent||e.data.type!=="streamlit:render")return;
 const args=e.data.args;
 if(revision!==args.revision){revision=args.revision;box.value=args.text;last="";status.textContent="Highlight one word or phrase.";}
 resize();
});
new ResizeObserver(resize).observe(box);
send("streamlit:componentReady",{apiVersion:1});
resize();
</script></body></html>
